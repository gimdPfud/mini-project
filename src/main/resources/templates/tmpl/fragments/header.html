<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <th:block th:fragment="header">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <div class="d-flex w-100 justify-content-between align-items-center">
                    <!-- 왼쪽: 로고 -->
                    <div class="ms-3">
                        <a class="navbar-brand" href="/">
                            <img src="/ynm.png" alt="Yang&Mal" width="150" height="50">
                        </a>
                    </div>

                    <!-- 중간: 검색창 -->
                    <div class="input-group w-50">
                        <input type="text" class="form-control" placeholder="찾고 싶은 상품을 검색해보세요!" aria-describedby="searchbtnoff">
                        <button class="btn btn-secondary" type="button" id="searchbtnoff">
                            <img src="/searchiconw.png" width="25" height="25">
                        </button>
                    </div>

                    <!-- 오른쪽: 버튼들 -->
                    <div class="me-3">
                        <a href="/" class="btn btn-secondary m-1">
                            <img src="/cartw.png" width="25" height="25">
                        </a>
                        <th:block sec:authorize="isAuthenticated()">
                            <a href="/" class="btn btn-secondary m-1">마이페이지</a>
                        </th:block>
                        <th:block sec:authorize="isAnonymous()">
                            <a href="/ynm/user/login" class="btn btn-secondary m-1">로그인</a>
                        </th:block>
                        <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                            <a href="/" class="btn btn-danger m-1">관리자메뉴</a>
                        </th:block>
                        <button class="btn btn-outline-secondary m-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWithBothOptions" aria-controls="offcanvasWithBothOptions">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 오프캔버스 메뉴 -->
        <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="offcanvasWithBothOptions" aria-labelledby="offcanvasWithBothOptionsLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="offcanvasWithBothOptionsLabel">
                    <img src="/ynm.png" alt="Yang&Mal" width="150" height="50">
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="d-grid gap-2 col-10 mx-auto">
                    <button class="btn btn-primary" type="button">Button</button>
                    <button class="btn btn-primary" type="button">Button</button>
                </div>
            </div>
        </div>
    </th:block>

</body>
</html>
