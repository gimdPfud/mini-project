<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{tmpl/layouts/layout}">
<head>
    <style>
        .star{
            color: red;
        }
    </style>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<th:block layout:fragment="content">
    <form action="/ynm/user/signUp" method="post" th:object="${memberDTO}">
        <div class="row mt-3">
            <div class="col-6 offset-3">

                <h1 class="text-center mb-3">회원가입</h1>

                <!--todo 이름-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input th:field="*{name}" type="text" class="form-control" id="name" name="name" required>
                            <label for="name">이름 <span class="star">*</span></label>
                            <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="fieldError"></p>
                        </div>
                    </div>
                </div>

                <!--todo 이메일-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input name="email" th:field="*{email}" type="email" class="form-control" id="email" required>
                            <label for="email">이메일 <span class="star">*</span></label>
                            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="fieldError"></p>
                        </div>
                    </div>
                </div>

                <!--todo 비밀번호-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" name="password" th:field="*{psw}"  id="password" required>
                            <label for="password">비밀번호 <span class="star">*</span></label>
                            <p th:if="${#fields.hasErrors('psw')}" th:errors="*{psw}" class="fieldError"></p>
                        </div>
                    </div>
                </div>

                <!--todo 주소-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3 input-group">
                            <input class="form-control" th:field="*{addr}" name="addr" type="text" id="sample5_address" readonly>
                            <input type="button" class="btn btn-secondary" onclick="sample5_execDaumPostcode()" value="주소 검색">
                        </div>
                    </div>
                </div>

                <!--todo 상세주소-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">
                            <input class="form-control" th:field="*{addr_detail}" name="addr_detail" type="text">
                            <label for="addr_detail">상세주소</label>
                        </div>
                    </div>
                </div>

                <!--todo 전화번호-->
                <div class="row">
                    <div class="col">
                        <div class="telError"></div>
                        <div class="form-floating mb-3">
                            <div class="input-group">
                                <span class="input-group-text p-3">전화번호</span>
                                <input type="text" th:field="*{tel}" class="form-control"
                                       placeholder="010-1234-5678">
                            </div>
                        </div>
                    </div>
                </div>

                <!--todo 성별-->
                <div class="row">
                    <div class="col">
                        <div class="form-floating mb-3">

                            <div class="row mb-3 align-items-center">
                                <div class="col-auto">
                                    <label class="input-group-text">성별</label>
                                </div>
                                <!-- 라디오 버튼 그룹 -->
                                <div class="col-auto">
                                    <div class="btn-group" role="group" aria-label="Gender options">
                                        <input class="form-check-input" type="radio" id="genderN" th:field="*{gender}" value="N" checked>
                                        <label class="form-check-label" for="genderN">밝히지 않음</label>
                                        <input class="form-check-input" type="radio" id="genderM" th:field="*{gender}" value="M">
                                        <label class="form-check-label" for="genderM">남성</label>
                                        <input class="form-check-input" type="radio" id="genderF" th:field="*{gender}" value="F">
                                        <label class="form-check-label" for="genderF">여성</label>
                                    </div>
                                </div>
                            </div>


                        </div>
                    </div>
                </div>

                <!--todo 버튼-->
                <div class="row mt-3">
                    <div class="col text-center d-grid">
                        <button type="submit" class="btn btn-secondary signUpbtn p-3">회원가입 &Gt;</button>
                    </div>
                </div>

            </div>
        </div>
    </form>

    <!--주소 api-->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function sample5_execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = data.address; // 최종 주소 변수

                    // 주소 정보를 해당 필드에 넣는다.
                    document.getElementById("sample5_address").value = addr;
                }
            }).open();
        }

        let signUpbtn = $(".signUpbtn")
        let tel = $("#tel")
        let telError = $(".telError")

        signUpbtn.on("click",function (e) {
            e.preventDefault();
            var telRule =/^\d{3}-\d{3,4}-\d{4}$/;
            if(!telRule.test(tel.val())){
                appendAlert('전화번호 양식에 맞추어 작성해주세요.', 'danger')
            }
        })

        const appendAlert = (message, type) => {
            const wrapper = document.createElement('div')
            wrapper.innerHTML = [
                `<div class="alert alert-${type} alert-dismissible mb-3" role="alert">`,
                `   <div>${message}</div>`,
                '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                '</div>'
            ].join('')

            telError.append(wrapper)
        }
    </script>

</th:block>
</body>
</html>
